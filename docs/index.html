<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The SME AI Gap</title>
<meta name="description" content="How far behind large enterprises Europe's small firms are on AI adoption — by country, size band and workforce, from Eurostat.">
<meta property="og:title" content="The SME AI Gap">
<meta property="og:description" content="Small firms adopt AI at a fraction of the rate large enterprises do. The gap, by country, from Eurostat.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="style.css">
</head>
<body>

<p id="boot" class="loading">Loading data…</p>

<div class="shell" id="app" hidden>

  <aside class="sidebar">
    <div class="brand">SME Digital &amp;<br>AI Readiness · EU-27</div>

    <div class="viewswitch" id="viewswitch" role="tablist" aria-label="Unit of observation">
      <button type="button" role="tab" data-view="firm" aria-selected="true">Companies</button>
      <button type="button" role="tab" data-view="individual" aria-selected="false">Individuals</button>
    </div>

    <nav class="analyses" aria-label="Analyses">
      <p class="side-label">Analyses</p>
      <ol id="nav"></ol>
    </nav>
  </aside>

  <main>
    <header class="masthead">
      <h1 id="headline"></h1>
      <p class="standfirst" id="standfirst"></p>
      <p class="unit-banner" id="unit-banner"></p>
    </header>

    <div class="toolbar" id="toolbar">
      <div class="field">
        <label id="lbl-geo" for="dd-geo-button">Country</label>
        <div class="dropdown" id="dd-geo"></div>
      </div>

      <div class="field" id="fld-primary">
        <label id="lbl-primary" for="primary-select">Size band</label>
        <select id="primary-select"></select>
      </div>

      <div class="field">
        <label for="compare-mode">Compare by</label>
        <select id="compare-mode">
          <option value="band" id="opt-mode-band">Size band</option>
          <option value="geo">Country</option>
        </select>
      </div>

      <div class="field">
        <label for="compare-select" id="lbl-compare">Compare with</label>
        <select id="compare-select"></select>
      </div>
    </div>

    <div id="sections"></div>

    <footer class="colophon">
      <p id="generated"></p>
      <p>
        Percentages are Eurostat's; absolute figures derived from them are estimates.
        Micro-enterprises under 10 employees are never sampled by the ICT surveys, so
        every &ldquo;SME&rdquo; figure on this page excludes them.
      </p>
    </footer>
  </main>

</div>

<script src="app.js"></script>
</body>
</html>
